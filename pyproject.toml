[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-nacl-audit"
version = "0.1.0"
description = "Audit AWS network ACLs for missing stateless return paths, default allow-all subnets, shadowed rules and open exposure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "vpc", "nacl", "network-acl", "audit", "security", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]
dependencies = ["boto3>=1.34", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
aws-nacl-audit = "aws_nacl_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-nacl-audit"
Issues = "https://github.com/moveeeax/aws-nacl-audit/issues"

[tool.setuptools.packages.find]
include = ["aws_nacl_audit*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
